<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Time!</title>
  <meta name="description" content="A friendly, easy-to-read quiz game with history and geography questions.">
  <meta name="theme-color" content="#fffbf2">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
  <link rel="preload" href="fonts/atkinson-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/atkinson-bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="toolbar">
    <div class="toolbar-inner">
      <span class="brand" aria-hidden="true">🧠 Quiz Time!</span>
      <div class="controls">
        <button id="text-smaller" class="ctrl-btn" type="button" aria-label="Make text smaller">A−</button>
        <button id="text-bigger" class="ctrl-btn" type="button" aria-label="Make text bigger">A+</button>
        <button id="theme-toggle" class="ctrl-btn" type="button" aria-pressed="false">🌙 Dark</button>
        <button id="voice-toggle" class="ctrl-btn" type="button" aria-pressed="false">🔊 Voice: Off</button>
      </div>
    </div>
  </header>

  <main id="main">

    <!-- HOME SCREEN -->
    <section id="screen-home" class="screen">
      <h1>Welcome to Quiz Time!</h1>
      <p class="lead">Pick a quiz to play. Each round has 10 questions.</p>
      <div class="menu">
        <button class="big-btn menu-btn" type="button" data-category="history">
          <span class="menu-emoji" aria-hidden="true">🏛️</span>
          <span>
            <span class="menu-title">History</span>
            <span class="menu-sub">Kings, presidents, and days gone by</span>
          </span>
        </button>
        <button class="big-btn menu-btn" type="button" data-category="geography">
          <span class="menu-emoji" aria-hidden="true">🌍</span>
          <span>
            <span class="menu-title">Geography</span>
            <span class="menu-sub">Countries, capitals, rivers, and mountains</span>
          </span>
        </button>
        <button class="big-btn menu-btn" type="button" data-category="mix">
          <span class="menu-emoji" aria-hidden="true">✨</span>
          <span>
            <span class="menu-title">A Bit of Both</span>
            <span class="menu-sub">A little history, a little geography</span>
          </span>
        </button>
      </div>
      <p class="hint">Tip: use the <strong>A−</strong> and <strong>A+</strong> buttons at the top to change the text size.
      Turn on <strong>🔊 Voice</strong> to have questions read out loud.</p>
    </section>

    <!-- QUIZ SCREEN -->
    <section id="screen-quiz" class="screen" hidden>
      <div class="quiz-top">
        <p id="progress" class="progress" aria-live="polite"></p>
        <button id="read-btn" class="ctrl-btn" type="button">🔊 Read this question</button>
      </div>

      <div id="progress-bar" class="bar" aria-hidden="true"></div>

      <div class="question-card">
        <h2 id="question-text" class="question" tabindex="-1"></h2>
      </div>

      <div id="options" class="options" role="group" aria-label="Answer choices"></div>

      <p id="feedback" class="feedback" role="status" aria-live="assertive"></p>

      <div class="quiz-bottom">
        <button id="next-btn" class="big-btn next-btn" type="button" hidden>Next question ➜</button>
        <button id="quit-btn" class="quiet-btn" type="button">Stop and go back to the menu</button>
      </div>

      <p class="hint keyboard-hint">Tip: you can press <strong>1, 2, 3 or 4</strong> on your keyboard to answer.</p>
    </section>

    <!-- RESULTS SCREEN -->
    <section id="screen-results" class="screen" hidden>
      <p id="result-emoji" class="result-emoji" aria-hidden="true"></p>
      <h2 id="result-title" class="result-title" tabindex="-1"></h2>
      <p id="result-score" class="result-score"></p>
      <div class="menu">
        <button id="again-btn" class="big-btn" type="button">🔁 Play again</button>
        <button id="home-btn" class="big-btn" type="button">🏠 Back to the menu</button>
      </div>
    </section>

  </main>

  <footer class="footer">
    <p>Made with ❤️ for Mom</p>
  </footer>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
